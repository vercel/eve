packages:
  - "."

minimumReleaseAgeExclude:
  - eve
  - "@vercel/connect"
  - ai
  - "@comark/nuxt@0.9.1"
  - "@comark/vue@0.9.1"
  - comark@0.9.1

allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  esbuild: true
  sharp: false
  vue-demi: false

# Keep transitive schema validation on the patched Zod 4 release.
overrides:
  "zod@>=4.0.0 <4.6.6": "4.6.7"
