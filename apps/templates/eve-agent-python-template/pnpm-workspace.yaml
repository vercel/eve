minimumReleaseAgeExclude:
  - eve
  - ai
  - zod
  - "@ai-sdk/*"

allowBuilds:
  esbuild: true
  sharp: true
  # Optional native compression add-ons pulled in by just-bash (local sandbox); not needed.
  "@mongodb-js/zstd": false
  node-liblzma: false
