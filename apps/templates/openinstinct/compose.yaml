services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: open_instinct
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_instinct"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
