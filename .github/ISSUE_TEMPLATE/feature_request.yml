name: Feature request
description: Suggest an improvement or share a prompt for the team's coding agents.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome prompts as issues and greatly appreciate your ideas and investigation. Share the problem and desired outcome below. If you have a prompt or implementation plan in mind, include it for the team to review and run with our own coding agents, using our chosen models and skills.

        Start with a short prompt; a detailed plan is optional, and you do not need to submit a pull request. Search [existing issues](https://github.com/vercel/eve/issues) first to avoid duplicating active work. See [Contributing to eve](https://github.com/vercel/eve/blob/main/CONTRIBUTING.md#proposing-a-change) for guidance.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: A clear description of the use case or pain point. Why does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API sketches or examples if you have them.
    validations:
      required: true
  - type: textarea
    id: implementation-prompt
    attributes:
      label: Prompt or implementation plan for our agents (optional)
      description: Share a prompt the team can run if the proposal is accepted. Describe the intended behavior, relevant code or docs, constraints, and how to validate the result. Include implementation steps if you know them; an incomplete prompt is welcome.
      placeholder: |
        Implement the behavior described above.

        Relevant code or docs:
        - ...

        Constraints and proposed steps:
        - ...

        Validation:
        - ...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you've considered.
    validations:
      required: false
