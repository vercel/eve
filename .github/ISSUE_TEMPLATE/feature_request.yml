name: Feature request
description: Suggest an idea or improvement for eve.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: A clear description of the use case or pain point. Why does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API sketches or examples if you have them.
    validations:
      required: true
  - type: textarea
    id: implementation-plan
    attributes:
      label: Suggested implementation plan
      description: Outline a plan the team can review and run with its own coding agents if the proposal is accepted. Include relevant code or docs, proposed changes, constraints, and validation steps. Share what you know even if the plan is incomplete.
      placeholder: |
        Proposed changes:
        - ...

        Constraints and trade-offs:
        - ...

        Validation:
        - ...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you've considered.
    validations:
      required: false
