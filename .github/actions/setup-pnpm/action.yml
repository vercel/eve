name: "Setup pnpm"
description: >-
  Put package.json's pnpm on the PATH. pnpm/action-setup installs a bootstrap
  pnpm with npm and then self-updates it to that version on every job (5-10 s
  on Linux, about 25 s on Windows), so the installed pnpm is cached by version
  and the action runs only when the cache misses. Every run restores the
  cache; only runs on main save it, as for the other caches.

runs:
  using: "composite"
  steps:
    - name: Read the pnpm version and home
      id: pnpm
      shell: bash
      run: |
        node -e '
          const { join } = require("node:path");
          const { homedir } = require("node:os");
          const version = require("./package.json").packageManager;
          const home = join(homedir(), "setup-pnpm", "node_modules", ".bin");
          require("node:fs").appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${version}\nhome=${home}\nbin=${join(home, "bin")}\n`,
          );
        '

    - name: Restore pnpm
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/setup-pnpm
        key: setup-pnpm-${{ runner.os }}-${{ steps.pnpm.outputs.version }}

    - name: Install pnpm
      if: steps.cache.outputs.cache-hit != 'true'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    # The same PATH and PNPM_HOME pnpm/action-setup sets: the self-updated pnpm
    # in PNPM_HOME/bin comes first.
    - name: Use the cached pnpm
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        PNPM_HOME_DIR: ${{ steps.pnpm.outputs.home }}
        PNPM_BIN_DIR: ${{ steps.pnpm.outputs.bin }}
      run: |
        echo "$PNPM_HOME_DIR" >>"$GITHUB_PATH"
        echo "$PNPM_BIN_DIR" >>"$GITHUB_PATH"
        echo "PNPM_HOME=$PNPM_HOME_DIR" >>"$GITHUB_ENV"

    # Saved before any install, so the cache holds pnpm and not the packages
    # pnpm stores under PNPM_HOME on Linux.
    - name: Save pnpm
      if: (github.ref == 'refs/heads/main' || github.head_ref == 'ci/speedup-stack') && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/setup-pnpm
        key: ${{ steps.cache.outputs.cache-primary-key }}
