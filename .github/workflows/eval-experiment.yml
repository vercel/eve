name: Eval experiment

on:
  workflow_dispatch:
    inputs:
      definition:
        description: Repository-relative experiment module
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: eval-experiment-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EVE_SANDBOX_IMAGE_TAG: latest
    steps:
      - name: Checkout experiment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate definition and write plan
        env:
          DEFINITION: ${{ inputs.definition }}
        run: |
          case "$DEFINITION" in experiments/*.mjs) ;; *) echo "Definition must be under experiments/"; exit 1 ;; esac
          node scripts/eval-experiments/plan.mjs "$DEFINITION" plan.json
      - name: Prepare source checkouts
        run: node scripts/eval-experiments/prepare-checkouts.mjs "$GITHUB_WORKSPACE" plan.json checkouts.json .experiment-worktrees
      - name: Execute immutable schedule
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: node scripts/eval-experiments/run.mjs plan.json checkouts.json execution
      - name: Reanalyze archived evidence
        if: always()
        env:
          DEFINITION: ${{ inputs.definition }}
        run: |
          set +e
          node scripts/eval-experiments/extract.mjs execution plan.json samples.json "$DEFINITION" "${GITHUB_SHA}"
          extract_status=$?
          node scripts/eval-experiments/compare.mjs plan.json samples.json report.json report.md
          compare_status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$extract_status" -ne 0 ]; then exit "$extract_status"; fi
          exit "$compare_status"
      - name: Upload reproducible experiment artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-experiment-${{ github.run_id }}
          path: |
            plan.json
            execution
            samples.json
            report.json
            report.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
