name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Jobs that read the whole workspace -- lint, typecheck, and the unit tier, which
# includes the docs site's tests -- install everything and share setup-node's
# pnpm cache. Every other job installs only the workspace packages its commands
# read, each under its own pnpm store cache key. See .github/actions/pnpm-install.
# The pnpm store, lockfile verdict, and browser caches are restored on every run
# and saved only on main, so pull requests don't fill the repository's cache.

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # No step here reads git history: the only git call is the
      # `git check-attr` in scripts/sync-template-files.mjs, which reads
      # .gitattributes from the checkout.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      # pnpm verifies the lockfile against the supply-chain policies on every
      # install (13 s on Linux, 44 s on Windows). Its verdict log is keyed by the
      # lockfile hash, so caching it keeps the check and skips the re-check.
      - name: Restore the lockfile verification verdict
        id: verdict-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-lock-verdict-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.cache-dir="${{ runner.temp }}/pnpm-cache"

      - name: Save the lockfile verification verdict
        if: github.ref == 'refs/heads/main' && steps.verdict-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: ${{ steps.verdict-cache.outputs.cache-primary-key }}

      - name: Run lint
        run: pnpm lint

      - name: Check dependency versions are in sync
        run: pnpm check:deps

      - name: Check the pinned sandbox image tag matches the Dockerfile
        run: pnpm check:sandbox-image-tag

      - name: Guard against committed test fixtures
        run: pnpm guard:fixtures

      - name: Guard mechanical code invariants
        run: pnpm guard:invariants

      - name: Check templates match their copied source files
        run: pnpm check:template-files

      - name: Validate /docs/public frontmatter and nav
        run: pnpm docs:check

  typecheck:
    runs-on: ubuntu-latest
    # The CLI spawns git and a detached flush process for every command when
    # telemetry is on. CI runs collect none of it.
    env:
      EVE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Restore the lockfile verification verdict
        id: verdict-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-lock-verdict-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.cache-dir="${{ runner.temp }}/pnpm-cache"

      - name: Save the lockfile verification verdict
        if: github.ref == 'refs/heads/main' && steps.verdict-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: ${{ steps.verdict-cache.outputs.cache-primary-key }}

      - name: Run typecheck
        run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Restore the lockfile verification verdict
        id: verdict-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-lock-verdict-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.cache-dir="${{ runner.temp }}/pnpm-cache"

      - name: Save the lockfile verification verdict
        if: github.ref == 'refs/heads/main' && steps.verdict-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: ${{ steps.verdict-cache.outputs.cache-primary-key }}

      - name: Run unit tests
        run: pnpm test:unit

      - name: Test workflow and guard helpers
        run: node --test .github/scripts/*.test.mjs scripts/hitl-state-readers.test.mjs scripts/changeset-format.test.mjs scripts/package-changelog.test.mjs scripts/public-exports.test.mjs

      - name: Test eval benchmark scripts
        run: pnpm test:eval-benchmark

  test-integration:
    name: test-integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The integration tier of every package with one, plus the fixtures and
      # registry sources their tests read. `apps/docs/registry` installs the
      # adapter packages the registry templates import.
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cache-key: integration
          filters: |
            eve...
            @eve/code...
            @eve/git...
            @eve/custom-skills...
            @eve/agent-browser...
            @eve/agent-desktop...
            @vercel/agent-runs...
            @eve-e2e/config...
            ./apps/fixtures/*
            ./e2e/fixtures/*
            ./apps/docs/registry

      - name: Run integration tests
        run: pnpm test:integration

  test-scenario:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      # This job builds agents whose sandboxes pull eve's default image.
      - name: Resolve eve sandbox image
        uses: ./.github/actions/sandbox-image
        with:
          pull: "true"

      - name: Restore the lockfile verification verdict
        id: verdict-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-lock-verdict-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.cache-dir="${{ runner.temp }}/pnpm-cache"

      - name: Save the lockfile verification verdict
        if: github.ref == 'refs/heads/main' && steps.verdict-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: ${{ steps.verdict-cache.outputs.cache-primary-key }}

      - name: Run scenario tests
        run: pnpm test:scenario

  # The desktop job installs apt packages and pulls agent-desktop from npm, so it
  # runs only when its package changes. It skips at the job level instead of
  # using `on.pull_request.paths`: a skipped job still reports, and a skipped
  # required check counts as satisfied. eve changes that break the extension are
  # caught by the package's integration tests in test-integration.
  agent-desktop-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit; HEAD^1 is the base branch tip.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(\.nvmrc$|pnpm-lock\.yaml$|packages/eve-agent-desktop/|\.github/workflows/ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  test-agent-desktop:
    needs: agent-desktop-changes
    if: needs.agent-desktop-changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cache-key: agent-desktop
          filters: |
            @eve/agent-desktop...

      - name: Build the desktop extension and its workspace dependencies
        run: pnpm exec turbo run build --filter=@eve/agent-desktop

      - name: Install the targeted agent-desktop CLI
        working-directory: packages/eve-agent-desktop
        run: |
          version=$(node --input-type=module -e 'import { AGENT_DESKTOP_VERSION } from "./dist/sandbox/sandbox.js"; console.log(AGENT_DESKTOP_VERSION)')
          npm install --prefix "${{ runner.temp }}/agent-desktop-cli" --no-save "agent-desktop@$version"
          echo "${{ runner.temp }}/agent-desktop-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check every tool against the real CLI
        run: pnpm --filter @eve/agent-desktop test:conformance

      - name: Drive a real Linux desktop
        env:
          AGENT_DESKTOP_LIVE: "1"
        run: pnpm --filter @eve/agent-desktop test:live

  test-framework-fixtures:
    name: test-framework-fixtures (next, nuxt, sveltekit, tanstack, vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The smoke builds build the framework apps against the workspace eve.
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cache-key: framework-fixtures
          filters: |
            eve...
            ./apps/frameworks/*

      - name: Build framework fixtures against the workspace eve dist
        run: pnpm test:framework-fixtures

  test-webchat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The browser tests install the web chat template's own dependencies in a
      # temp directory, so the workspace install is eve's.
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cache-key: webchat
          filters: |
            eve...

      # The browser build the tests launch, at packages/eve's playwright-core
      # version. The cache holds it; system libraries are installed only when the
      # cache missed.
      - name: Read the playwright-core version
        id: playwright
        run: echo "version=$(node -p 'require("./packages/eve/package.json").devDependencies["playwright-core"]')" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-headless-shell-${{ steps.playwright.outputs.version }}

      # Skips the download when the cached browser is this version's revision.
      - name: Install the browser
        env:
          WITH_DEPS: ${{ steps.browser-cache.outputs.cache-hit != 'true' && '--with-deps' || '' }}
        run: pnpm --filter eve exec playwright-core install $WITH_DEPS chromium-headless-shell

      - name: Save the browser
        if: github.ref == 'refs/heads/main' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Run web chat tests
        run: pnpm test:webchat

  test-templates:
    runs-on: ubuntu-latest
    # The CLI spawns git and a detached flush process for every command when
    # telemetry is on. CI runs collect none of it.
    env:
      EVE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # This job builds agents whose sandboxes pull eve's default image.
      - name: Resolve eve sandbox image
        uses: ./.github/actions/sandbox-image

      # Each template installs its own dependencies from its own lockfile; the
      # only workspace package this check reads is the packed eve.
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cache-key: templates
          filters: |
            eve...

      - name: Check templates with their lockfiles and the packed eve package
        run: pnpm check:templates

  test-tui:
    runs-on: ubuntu-latest
    environment:
      name: eve-ci
      deployment: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # This job builds agents whose sandboxes pull eve's default image.
      - name: Resolve eve sandbox image
        uses: ./.github/actions/sandbox-image

      # The smoke tests start their agent apps from the shared fixtures.
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cache-key: tui
          filters: |
            eve...
            ./apps/fixtures/*
            ./e2e/fixtures/*

      - name: Run TUI smoke tests
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: pnpm test:tui
