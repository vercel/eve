name: Publish tarball

on:
  workflow_run:
    workflows: [Build tarball]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  report-build-failure:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Report publication failure
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: run.head_sha,
              state: "failure",
              context: "Package artifact",
              description: "Package tarball build failed",
              target_url: run.html_url,
            });

  publish:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    concurrency:
      group: package-artifact-publish-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Report publication started
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: run.head_sha,
              state: "pending",
              context: "Package artifact",
              description: "Publishing package tarball",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      # workflow_run loads this workflow from the default branch. Keep every
      # credentialed operation in that trusted checkout, never the PR checkout.
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Download package artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: eve-package
          path: package-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: trusted/.nvmrc
          cache: pnpm
          cache-dependency-path: trusted/pnpm-lock.yaml

      - name: Install publisher dependencies
        working-directory: trusted
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Resolve after setup and download so stale builds are rejected as close as
      # possible to the mutable pointer update.
      - name: Resolve publication target
        id: target
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const { resolvePublicationTarget } = await import(
              `${process.env.GITHUB_WORKSPACE}/trusted/apps/package-artifacts/lib/publication-target.mjs`
            );
            const target = await resolvePublicationTarget(github, context);
            core.setOutput("sha", target.sha);
            core.setOutput("ref", target.ref);

      - name: Publish package artifact
        id: publish
        working-directory: trusted
        env:
          EVE_PACKAGE_BLOB_READ_WRITE_TOKEN: ${{ secrets.EVE_PACKAGE_BLOB_READ_WRITE_TOKEN }}
          EVE_PACKAGE_INPUT_DIRECTORY: ${{ github.workspace }}/package-artifact
          EVE_PACKAGE_REF: ${{ steps.target.outputs.ref }}
          EVE_PACKAGE_SOURCE_SHA: ${{ steps.target.outputs.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter eve-package-artifacts package:publish

      - name: Report publication result
        if: always()
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const success = process.env.PUBLISH_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: run.head_sha,
              state: success ? "success" : "failure",
              context: "Package artifact",
              description: success ? "Package tarball is ready" : "Package tarball publication failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
