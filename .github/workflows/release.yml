name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # Do not abort an in-flight `changeset publish`: npm could be left with only
    # some packages published. Keep this scoped to stable releases so every
    # commit can run its continuous release independently.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-stable
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `changeset version` runs `git fetch --deepen` loops on
          # shallow clones (to find the commit that added each changeset), and those
          # in-flight packfiles crash the github-api commit (isomorphic-git
          # "Could not read packfile .tmp-*-pack-*").
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `commitMode: github-api` commits through @changesets/ghcommit, which
      # reads the repo with isomorphic-git. Unlike git itself, isomorphic-git
      # tries to parse every *.pack file in .git/objects/pack — including
      # stale temp packfiles left behind when a fetch is interrupted or
      # retried during checkout — and fails with "Could not read packfile
      # at … .tmp-<pid>-pack-<sha>.pack". Drop any temp packs first.
      - name: Remove stale git temp packfiles
        run: rm -f .git/objects/pack/.tmp-* .git/objects/pack/tmp_*

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark eve as the latest GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version="$(jq -r '.[] | select(.name == "eve") | .version' <<< "$PUBLISHED_PACKAGES")"
          if [[ -n "$version" ]]; then
            gh release edit "eve@$version" --latest
          fi

  # Runs stay independent so every commit gets a snapshot. When pushes overlap,
  # `canary` follows publish completion order and may briefly point to an older
  # commit; immutable snapshot versions remain the reproducible install path.
  continuous-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version continuous release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Authored changesets belong to the stable release plan. Remove them
          # from this ephemeral checkout so only eve receives a snapshot.
          rm -f .changeset/*.md
          cat > .changeset/continuous-release.md <<EOF
          ---
          "eve": patch
          ---

          Continuous release for $COMMIT_SHA.
          EOF

          pnpm exec changeset version --snapshot \
            --snapshot-prerelease-template "g${COMMIT_SHA:0:12}"

      - name: Publish continuous release
        run: |
          pnpm build
          node scripts/assert-changeset-publish-packages.mjs
          pnpm exec changeset publish --tag canary --no-git-tag

          version="$(jq -r .version packages/eve/package.json)"
          echo "Install this commit with \`npm install eve@$version\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Install the latest continuous release with \`npm install eve@canary\`." >> "$GITHUB_STEP_SUMMARY"
