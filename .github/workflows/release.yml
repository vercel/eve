name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue runs instead of cancelling: aborting a run mid-`changeset publish`
# can leave npm with only some of the packages published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/vercel/eve
  VCR_IMAGE: vcr.vercel.com/vercel/eve/base

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `changeset version` runs `git fetch --deepen` loops on
          # shallow clones (to find the commit that added each changeset), and those
          # in-flight packfiles crash the github-api commit (isomorphic-git
          # "Could not read packfile .tmp-*-pack-*").
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve sandbox image tag
        if: github.ref == 'refs/heads/main'
        id: image-tags
        run: |
          set -euo pipefail

          node scripts/sandbox-image-tag.mjs --check
          tag="$(node scripts/sandbox-image-tag.mjs)"
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          echo "ghcr-tag=${GHCR_IMAGE}:${tag}" >>"$GITHUB_OUTPUT"
          echo "vcr-tag=${VCR_IMAGE}:${tag}" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Vercel Container Registry
        if: github.ref == 'refs/heads/main'
        # Public workflows cannot resolve the upstream action while its repository is private.
        uses: ./.github/actions/vcr-login
        with:
          team: ${{ secrets.VCR_TEAM_ID }}

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Content tags are immutable: an existing tag is never rebuilt, so every
      # registry serves the bytes the first build produced.
      - name: Check which registries already have the sandbox image
        if: github.ref == 'refs/heads/main'
        id: image-state
        env:
          GHCR_TAG: ${{ steps.image-tags.outputs.ghcr-tag }}
          VCR_TAG: ${{ steps.image-tags.outputs.vcr-tag }}
        run: |
          set -euo pipefail

          published() {
            local inspect_output
            if inspect_output="$(docker buildx imagetools inspect --raw "$1" 2>&1)"; then
              echo true
            elif grep -Eq ': not found|manifest unknown' <<<"$inspect_output"; then
              echo false
            else
              echo "$inspect_output" >&2
              exit 1
            fi
          }

          ghcr="$(published "$GHCR_TAG")"
          vcr="$(published "$VCR_TAG")"
          if [[ "$ghcr" == false && "$vcr" == true ]]; then
            echo "::error::$VCR_TAG exists but $GHCR_TAG does not. GHCR is published first and holds the arm64 variant, so it cannot be restored from VCR; delete $VCR_TAG and rerun." >&2
            exit 1
          fi
          echo "build=$([[ "$ghcr" == false ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "copy-to-vcr=$([[ "$vcr" == false ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      # These build settings are not part of the content tag. Changing them
      # republishes nothing until the Dockerfile also changes.
      - name: Build and publish the sandbox image to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && steps.image-state.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./packages/eve
          file: ./packages/eve/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.image-tags.outputs.ghcr-tag }}
          labels: |
            org.opencontainers.image.title=eve Sandbox
            org.opencontainers.image.description=Sandbox base image for eve agents.
            org.opencontainers.image.source=https://github.com/vercel/eve
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-tags.outputs.tag }}
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vercel Sandbox runs amd64 and VCR has always received a single-platform
      # manifest. Copying the GHCR amd64 manifest by digest keeps that shape
      # and guarantees both registries serve identical bytes. skopeo reads the
      # credentials `docker login` wrote for both registries.
      - name: Copy the amd64 sandbox image to Vercel Container Registry
        if: github.ref == 'refs/heads/main' && steps.image-state.outputs.copy-to-vcr == 'true'
        env:
          GHCR_TAG: ${{ steps.image-tags.outputs.ghcr-tag }}
          VCR_TAG: ${{ steps.image-tags.outputs.vcr-tag }}
        run: |
          set -euo pipefail

          amd64_digest="$(docker buildx imagetools inspect --raw "$GHCR_TAG" \
            | jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
          skopeo copy --preserve-digests \
            "docker://${GHCR_IMAGE}@${amd64_digest}" \
            "docker://${VCR_TAG}"

      # `commitMode: github-api` commits through @changesets/ghcommit, which
      # reads the repo with isomorphic-git. Unlike git itself, isomorphic-git
      # tries to parse every *.pack file in .git/objects/pack — including
      # stale temp packfiles left behind when a fetch is interrupted or
      # retried during checkout — and fails with "Could not read packfile
      # at … .tmp-<pid>-pack-<sha>.pack". Drop any temp packs first.
      - name: Remove stale git temp packfiles
        run: rm -f .git/objects/pack/.tmp-* .git/objects/pack/tmp_*

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark eve as the latest GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version="$(jq -r '.[] | select(.name == "eve") | .version' <<< "$PUBLISHED_PACKAGES")"
          if [[ -n "$version" ]]; then
            gh release edit "eve@$version" --latest
          fi

      # `latest` serves authors who reference the image directly; eve pins its
      # own tag. The tag comes from the published eve package, not this commit,
      # so `latest` never points at an unreleased image. Every main run
      # converges, so a failed move heals on the next push.
      - name: Point latest sandbox image tags at the released eve image
        if: github.ref == 'refs/heads/main'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          set -euo pipefail

          version="$(jq -r '.[]? | select(.name == "eve") | .version' <<<"${PUBLISHED_PACKAGES:-[]}")"
          if [[ -z "$version" ]]; then
            version="$(npm view eve version)"
          fi
          # A version published moments ago can take a short time to appear.
          for attempt in $(seq 1 12); do
            if tarball="$(npm view "eve@${version}" dist.tarball 2>/dev/null)" && [[ -n "$tarball" ]]; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::eve@${version} is not visible on npm; rerun this job to move the latest sandbox image tags." >&2
              exit 1
            fi
            sleep 10
          done

          tag="$(curl -fsSL "$tarball" | tar -xzO --wildcards 'package/dist/*.js' | { grep -aoE 'dockerfile-[0-9a-f]{12}' || true; } | sort -u)"
          if [[ -z "$tag" ]]; then
            echo "eve@${version} predates content-tagged sandbox images; leaving latest unchanged."
            exit 0
          fi
          if [[ "$tag" == *$'\n'* ]]; then
            echo "::error::eve@${version} contains more than one sandbox image tag: ${tag//$'\n'/, }" >&2
            exit 1
          fi

          for image in "$GHCR_IMAGE" "$VCR_IMAGE"; do
            wanted="$(docker buildx imagetools inspect --raw "${image}:${tag}" | sha256sum)"
            current="$(docker buildx imagetools inspect --raw "${image}:latest" 2>/dev/null | sha256sum || true)"
            if [[ "$wanted" == "$current" ]]; then
              echo "${image}:latest already serves ${tag}."
            else
              skopeo copy --all --preserve-digests "docker://${image}:${tag}" "docker://${image}:latest"
              echo "Moved ${image}:latest to ${tag} (eve@${version})."
            fi
          done
