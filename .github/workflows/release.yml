name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue runs instead of cancelling: aborting a run mid-`changeset publish`
# can leave npm with only some of the packages published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VCR_IMAGE: vcr.vercel.com/vercel/eve/base

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `changeset version` runs `git fetch --deepen` loops on
          # shallow clones (to find the commit that added each changeset), and those
          # in-flight packfiles crash the github-api commit (isomorphic-git
          # "Could not read packfile .tmp-*-pack-*").
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare VCR tag
        if: github.ref == 'refs/heads/main'
        id: vcr-tag
        run: |
          set -euo pipefail

          version="$(jq -er '.version | select(type == "string" and length > 0)' packages/eve/package.json)"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "tag=${VCR_IMAGE}:${version}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Vercel Container Registry
        if: github.ref == 'refs/heads/main'
        uses: vercel/vcr-login-action@9340c52f6b68b4758d9d2eebbd4c52b36e66f7f3 # main
        with:
          team: ${{ secrets.VCR_TEAM_ID }}

      - name: Publish eve image to Vercel Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./packages/eve
          file: ./packages/eve/Dockerfile
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.vcr-tag.outputs.tag }}
            ${{ env.VCR_IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=eve Sandbox
            org.opencontainers.image.description=Sandbox base image for eve agents.
            org.opencontainers.image.source=https://github.com/vercel/eve
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vcr-tag.outputs.version }}
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `commitMode: github-api` commits through @changesets/ghcommit, which
      # reads the repo with isomorphic-git. Unlike git itself, isomorphic-git
      # tries to parse every *.pack file in .git/objects/pack — including
      # stale temp packfiles left behind when a fetch is interrupted or
      # retried during checkout — and fails with "Could not read packfile
      # at … .tmp-<pid>-pack-<sha>.pack". Drop any temp packs first.
      - name: Remove stale git temp packfiles
        run: rm -f .git/objects/pack/.tmp-* .git/objects/pack/tmp_*

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark eve as the latest GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version="$(jq -r '.[] | select(.name == "eve") | .version' <<< "$PUBLISHED_PACKAGES")"
          if [[ -n "$version" ]]; then
            gh release edit "eve@$version" --latest
          fi
