name: eve-code SWE-lean

on:
  pull_request:
    paths:
      - ".github/workflows/eve-code-benchmark.yml"
      - "packages/eve-code/**"
  workflow_dispatch:

concurrency:
  group: eve-code-swe-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout pinned eve-bench action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vercel-labs/eve-bench
          ref: f6140df6ab46bce89de823553abefe7e64074888
          ssh-key: ${{ secrets.EVE_BENCH_SSH_KEY }}
          path: .eve-bench-runner
          persist-credentials: false
      - name: Benchmark current eve-code source
        uses: ./.eve-bench-runner
        with:
          harness: eve-code
          agent-repository: vercel/eve
          agent-path: packages/eve-code
          agent-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          dataset: swe-lean
          model: ${{ vars.EVE_CODE_BENCH_MODEL || 'openai/gpt-5.6-terra' }}
          attempts: "1"
          concurrency: "4"
          native-build: "false"
          baseline-artifact-id: ${{ vars.EVE_BENCH_BASELINE_ARTIFACT_ID }}
          artifact-name: eve-code-swe-lean
          runner-revision: f6140df6ab46bce89de823553abefe7e64074888
          gateway-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          source-token: ${{ secrets.EVE_BENCH_SOURCE_TOKEN }}
          github-token: ${{ github.token }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-team-id: ${{ secrets.VERCEL_TEAM_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
