name: eve-code benchmark

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - ".github/workflows/eve-code-benchmark.yml"
      - "scripts/eve-code-benchmark*"
      - "apps/fixtures/eve-code-bench/**"
      - "packages/eve-code/**"
      - "packages/eve/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: eve-code-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BENCHMARK_REVISION: 4c87e8d4f0cca6965f5a4d0415a22fa38776d871
  BENCHMARK_MODEL: ${{ vars.EVE_CODE_BENCH_MODEL || 'openai/gpt-5.6-terra' }}

jobs:
  benchmark:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'eve-code-benchmark') &&
       (github.event.action != 'labeled' || github.event.label.name == 'eve-code-benchmark'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        arm: [baseline, candidate, codex, claude-code, opencode, hermes]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: ${{ matrix.arm }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCHMARK_ARM: ${{ matrix.arm }}
      BENCHMARK_SHARD: ${{ matrix.shard }}
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check benchmark orchestration
        run: node --test scripts/eve-code-benchmark*.test.mjs

      - name: Checkout pinned runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vercel-labs/eve-bench
          ref: ${{ env.BENCHMARK_REVISION }}
          ssh-key: ${{ secrets.EVE_BENCH_SSH_KEY }}
          path: .eve-bench-runner
          persist-credentials: false

      - name: Install runner
        working-directory: .eve-bench-runner
        run: npm ci

      - name: Stage original baseline extension
        if: matrix.arm == 'baseline'
        run: node scripts/eve-code-benchmark.mjs stage-baseline

      - name: Setup pnpm
        if: matrix.arm == 'baseline' || matrix.arm == 'candidate'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Build the same local framework for both eve-code arms
        if: matrix.arm == 'baseline' || matrix.arm == 'candidate'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=eve-code

      - name: Run full benchmark shard
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          test -n "$AI_GATEWAY_API_KEY" || { echo 'AI_GATEWAY_API_KEY is required.' >&2; exit 1; }
          node scripts/eve-code-benchmark.mjs run

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eve-code-result-${{ matrix.arm }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: benchmark-results/results/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload task diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eve-code-jobs-${{ matrix.arm }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: benchmark-results/jobs/
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: benchmark
    if: always() && needs.benchmark.result != 'skipped'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout only the trusted report implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/eve-code-benchmark-report.cjs
            scripts/eve-code-benchmark-config.json

      - name: Download this attempt's shard results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eve-code-result-*-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/eve-code-results

      - name: Publish comparison table
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_DIRECTORY: ${{ runner.temp }}/eve-code-results
        with:
          script: |
            const { publishReport } = require('./scripts/eve-code-benchmark-report.cjs');
            await publishReport({ github, context, core,
              directory: process.env.RESULT_DIRECTORY,
              model: process.env.BENCHMARK_MODEL });
