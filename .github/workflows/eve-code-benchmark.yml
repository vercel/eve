name: eve-code

on:
  pull_request:
    paths:
      - ".github/workflows/eve-code-benchmark.yml"
      - ".github/scripts/resolve-benchmark-request*"
      - "packages/eve-code/**"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      harness:
        description: Harness to benchmark on SWE-lean
        type: choice
        default: eve-code
        options: [eve-code, codex, opencode, claude-code, pi, hermes, oracle]

# OIDC alternative: add `id-token: write` here and omit `vercel-token` below
# after configuring a matching Vercel team OIDC policy.
permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  request:
    name: Resolve benchmark request
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/benchmark')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.request.outputs.run }}
      harness: ${{ steps.request.outputs.harness }}
      sha: ${{ steps.request.outputs.sha }}
      pr: ${{ steps.request.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { resolveBenchmarkRequest } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/resolve-benchmark-request.mjs`).href);
            const request = await resolveBenchmarkRequest({ github, context });
            core.setOutput('run', Boolean(request));
            if (request) for (const [key, value] of Object.entries(request)) core.setOutput(key, value);

  benchmark:
    name: Benchmark harness
    needs: request
    if: needs.request.outputs.run == 'true'
    concurrency:
      group: eve-code-${{ needs.request.outputs.pr || github.ref }}-${{ needs.request.outputs.harness }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # vercel/eve is public and eve-bench is private; GitHub never lets a public
      # repository `uses:` a private action, so fetch the pinned runner with a
      # read-only deploy key and run it as a local action instead.
      - name: Checkout pinned eve-bench action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vercel-labs/eve-bench
          ref: 707a2a723fa3ea1576b6e20c4765b3348a70e972
          ssh-key: ${{ secrets.EVE_BENCH_SSH_KEY }}
          path: .eve-bench-action
          persist-credentials: false
      - name: Run selected harness
        uses: ./.eve-bench-action
        with:
          harness: ${{ needs.request.outputs.harness }}
          agent-repository: vercel/eve
          agent-path: packages/eve-code
          agent-ref: ${{ needs.request.outputs.sha }}
          dataset: swe-lean
          model: ${{ vars.EVE_CODE_BENCH_MODEL || 'openai/gpt-5.6-terra' }}
          attempts: "1"
          concurrency: "4"
          native-build: "false"
          baseline-artifact-id: ${{ needs.request.outputs.harness == 'eve-code' && vars.EVE_BENCH_BASELINE_ARTIFACT_ID || '' }}
          artifact-name: swe-lean-${{ needs.request.outputs.harness }}
          gateway-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          github-token: ${{ github.token }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-team-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
