name: eve-code

on:
  pull_request:
    paths:
      - ".github/workflows/eve-code-benchmark.yml"
      - ".github/scripts/resolve-benchmark-request*"
      - "apps/benchmarks/code/**"
      - "packages/eve-code/**"
  push:
    branches: [main]
    paths:
      - "apps/benchmarks/code/**"
      - "packages/eve-code/**"
  schedule:
    - cron: "0 6 * * 1"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      harness:
        description: Comma-separated harnesses to benchmark
        type: string
        default: eve-code,opencode,pi,fx
      dataset:
        description: Benchmark dataset to run
        type: choice
        options: [swe-lean, deepswe-lean]
        default: swe-lean
      model:
        description: Model family to benchmark
        type: choice
        options: [all, anthropic, openai]
        default: all

permissions:
  contents: read

jobs:
  request:
    name: Resolve benchmark request
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/benchmark')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.request.outputs.run }}
      harness: ${{ steps.request.outputs.harness }}
      slug: ${{ steps.request.outputs.slug }}
      dataset: ${{ steps.request.outputs.dataset }}
      reasoning: ${{ steps.request.outputs.reasoning }}
      attempts: ${{ steps.request.outputs.attempts }}
      models: ${{ steps.request.outputs.models }}
      agent-source: ${{ steps.request.outputs.agentSource }}
      sha: ${{ steps.request.outputs.sha }}
      pr: ${{ steps.request.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ANTHROPIC_MODEL: ${{ vars.EVE_CODE_BENCH_MODEL || 'anthropic/claude-sonnet-5.5' }}
          OPENAI_MODEL: ${{ vars.EVE_CODE_BENCH_OPENAI_MODEL || 'openai/gpt-6.2-sol' }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { resolveBenchmarkRequest } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/resolve-benchmark-request.mjs`).href);
            const models = { anthropic: process.env.ANTHROPIC_MODEL, openai: process.env.OPENAI_MODEL };
            const request = await resolveBenchmarkRequest({ github, context, models });
            core.setOutput('run', Boolean(request));
            if (request) for (const [key, value] of Object.entries(request)) core.setOutput(key, value);

  benchmark:
    name: Benchmark harness (${{ matrix.family }})
    needs: request
    if: needs.request.outputs.run == 'true'
    concurrency:
      group: eve-code-${{ needs.request.outputs.pr || github.ref }}-${{ needs.request.outputs.dataset }}-${{ needs.request.outputs.slug }}-${{ matrix.family }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'issue_comment' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.request.outputs.models) }}
    runs-on: ubuntu-latest
    environment:
      name: eve-bench
      deployment: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install workspace dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cache-key: code-bench
          filters: |
            eve...
            @eve/code...
            @eve-internal/benchmarks...
      - name: Build eve
        if: needs.request.outputs.agent-source == 'true'
        run: pnpm build:eve
      - name: Run selected harnesses
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm --filter @eve-internal/benchmarks code-bench \
            --dataset "${{ needs.request.outputs.dataset }}" \
            --harness "${{ needs.request.outputs.harness }}" \
            --model "${{ matrix.model }}" \
            --reasoning "${{ needs.request.outputs.reasoning }}" \
            --attempts "${{ needs.request.outputs.attempts }}" \
            --concurrency 24 \
            --execution vercel-sandbox \
            --sha "${{ needs.request.outputs.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output "$GITHUB_WORKSPACE/benchmark-results"
      - name: Publish Actions summary
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/benchmark-results/report.md" ]; then
            cat "$GITHUB_WORKSPACE/benchmark-results/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark execution failed before a report was written.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Update pull request comment
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'issue_comment') && needs.request.outputs.pr != '' && needs.request.outputs.agent-source == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.request.outputs.pr }}
          COMMENT_FILE: ${{ github.workspace }}/benchmark-results/comment.md
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync(process.env.COMMENT_FILE)) return;
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
            const marker = body.split('\n')[0]?.trim();
            if (!marker || !marker.startsWith('<!-- eve-code-bench:')) return;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.request.outputs.dataset }}-${{ needs.request.outputs.slug }}-${{ matrix.family }}
          path: benchmark-results/
          include-hidden-files: false
          if-no-files-found: warn

  docs-snapshot:
    name: Refresh docs benchmark results
    needs: [request, benchmark]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.request.outputs.dataset == 'deepswe-lean' &&
      contains(fromJSON(needs.request.outputs.models).*.family, 'anthropic')
    concurrency:
      group: eve-code-docs-snapshot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Open snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.request.outputs.dataset }}-${{ needs.request.outputs.slug }}-anthropic
          FILE: apps/docs/lib/evals/eve-code-benchmark.json
          BRANCH: bot/eve-code-benchmark-snapshot
          TITLE: "chore: refresh eve-code benchmark results"
        run: |
          set -euo pipefail
          if ! gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D "$RUNNER_TEMP/bench" ||
            [ ! -f "$RUNNER_TEMP/bench/report.json" ]; then
            echo "::notice::eve-code docs snapshot not updated: the run uploaded no $ARTIFACT report."
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$head" -H "Accept: application/vnd.github.raw" > "$FILE"
          cp "$FILE" "$RUNNER_TEMP/before.json"
          node .github/scripts/eve-code-docs-snapshot.mjs "$RUNNER_TEMP/bench/report.json" "$FILE"
          if cmp -s "$FILE" "$RUNNER_TEMP/before.json"; then exit 0; fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$head" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$head" > /dev/null
          fi
          HEAD_OID="$head" node .github/scripts/eve-code-docs-snapshot.mjs --commit-payload "$FILE" > "$RUNNER_TEMP/commit.json"
          gh api graphql --input "$RUNNER_TEMP/commit.json" -q .data.createCommitOnBranch.commit.url

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Refreshes \`$FILE\` from the deepswe-lean \`anthropic\` report of $run_url.

          GitHub holds workflow runs on pull requests that \`GITHUB_TOKEN\` opens until a maintainer approves them. To run the required checks, select **Approve workflows to run** on this PR, as on the Version Packages PR. Then review and approve the PR; auto-merge squashes it once checks pass.

          Every refresh resets \`$BRANCH\` to \`main\`, so do not push other changes to it.
          EOF
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json url -q '.[0].url // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            pr=$(gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
          fi
          echo "Snapshot pull request: $pr"
          gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --auto --squash \
            --body "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" ||
            echo "::notice::Auto-merge was not enabled on $pr; merge it after approval."
