name: eve-code SWE-lean

on:
  pull_request:
    paths:
      - ".github/workflows/eve-code-benchmark.yml"
      - "packages/eve-code/**"
  workflow_dispatch:

concurrency:
  group: eve-code-swe-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# OIDC alternative: add `id-token: write` here and omit `vercel-token` below
# after configuring a matching Vercel team OIDC policy.
permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Benchmark current eve-code source
        uses: vercel-labs/eve-bench@2895a70f36c61535897c0bac771eb03cd89cda91
        with:
          harness: eve-code
          agent-repository: vercel/eve
          agent-path: packages/eve-code
          agent-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          dataset: swe-lean
          model: ${{ vars.EVE_CODE_BENCH_MODEL || 'openai/gpt-5.6-terra' }}
          attempts: "1"
          concurrency: "4"
          native-build: "false"
          baseline-artifact-id: ${{ vars.EVE_BENCH_BASELINE_ARTIFACT_ID }}
          artifact-name: eve-code-swe-lean
          gateway-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          github-token: ${{ github.token }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-team-id: ${{ secrets.VERCEL_TEAM_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
