name: eve-code SWE-lean

on:
  pull_request:
    paths:
      - ".github/workflows/eve-code-benchmark.yml"
      - "packages/eve-code/**"
      - "apps/fixtures/eve-code-bench/**"
  workflow_dispatch:

concurrency:
  group: eve-code-swe-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Build local eve-code
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=eve-code
      - name: Checkout native benchmark action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vercel-labs/eve-bench
          ref: 7558228d25344fc7917ad9fe8e7a42cca1629d5d
          ssh-key: ${{ secrets.EVE_BENCH_SSH_KEY }}
          path: .eve-bench-runner
          persist-credentials: false
      - name: Compare full SWE-lean and publish the table
        uses: ./.eve-bench-runner/comparison
        with:
          agent: ${{ github.workspace }}/apps/fixtures/eve-code-bench
          baseline-ref: ca27ee898e28dc90df5f0bb4ef713a4aad2fa5f3
          dataset: swe-lean
          model: ${{ vars.EVE_CODE_BENCH_MODEL || 'openai/gpt-5.6-terra' }}
          attempts: "1"
          concurrency: "1"
          readme-path: packages/eve-code/README.md
          gateway-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          github-token: ${{ github.token }}
