name: Eval Benchmark

# Tracks correctness, latency, and cost of fixture evals across models and eve
# versions, and publishes records to private Blob. Runs only on trusted
# `main` revisions and never on pull requests. Run legs hold model or Vercel
# deployment credentials, never the Blob token: the publish job is the only
# one that holds it.
#
# A `release` dispatch backfills a published eve release: the run legs check
# out its `eve@<version>` tag (that release's eve, fixtures, and eval runner)
# as the code under test, while main's harness (.benchmark-harness: planning,
# probes, and record derivation) runs against it. The run is dated at the
# release's npm publish time, skips hosted worlds, and publishes under
# imports/ (scripts/eval-benchmark/release.mjs). On main the two checkouts
# are the same commit.
run-name: ${{ inputs.release && format('Eval Benchmark (eve@{0} backfill)', inputs.release) || 'Eval Benchmark' }}

on:
  schedule:
    # Nightly; skipped when main has not moved since the last successful
    # scheduled run. Manual runs may be narrowed, so they never count.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated e2e/benchmark.json model names (empty for all, "none" for mock legs only)
        type: string
        default: ""
      fixtures:
        description: Comma-separated e2e/benchmark.json fixture names (empty for all)
        type: string
        default: ""
      attempts:
        description: Attempts per fixture and model (empty for the registry default)
        type: string
        default: ""
      release:
        description: Published eve version to backfill, e.g. 0.61.0 (empty to benchmark main)
        type: string
        default: ""

concurrency:
  # One group per backfilled release: a group holds a single pending run, so
  # dispatching several releases into one would cancel all but the last. The
  # prefix keeps an unvalidated input (e.g. "main") out of main's group.
  group: eval-benchmark-${{ inputs.release && format('release-{0}', inputs.release) || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.skip.outputs.run }}
      sha: ${{ steps.skip.outputs.sha }}
      live_matrix: ${{ steps.plan.outputs.live_matrix }}
      mock_matrix: ${{ steps.plan.outputs.mock_matrix }}
      hosted_matrix: ${{ steps.plan.outputs.hosted_matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      evals_per_leg: ${{ steps.plan.outputs.evals_per_leg }}
      dev_startup: ${{ steps.plan.outputs.dev_startup }}
      keep_state: ${{ steps.plan.outputs.keep_state }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Benchmark results publish only from refs/heads/main (got ${GITHUB_REF})."
          exit 1

      - name: Resolve code under test
        id: target
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -z "$RELEASE" ]; then
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref=refs/tags/eve@${RELEASE}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::release must be a published eve version such as 0.61.0 (got \"${RELEASE}\")."
            exit 1
          fi

      - name: Checkout code under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      - name: Require a release on main
        # Legs run the planned commit with model credentials, so a backfill
        # may only run a commit main has: a tag can point anywhere.
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/$(git rev-parse HEAD)...${GITHUB_SHA}" --jq .status)"
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error::$(git rev-parse HEAD) is not on main (compare status: ${status})."
            exit 1
          fi

      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .benchmark-harness
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .benchmark-harness/.nvmrc

      - name: Skip an unchanged nightly run
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "schedule" ]; then
            last_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow eval-benchmark.yml \
              --branch main --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
            if [ "$last_sha" = "$GITHUB_SHA" ]; then
              echo "main is still at the last benchmarked commit ${GITHUB_SHA}; skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Plan legs
        id: plan
        if: steps.skip.outputs.run == 'true'
        env:
          BENCHMARK_MODELS: ${{ inputs.models }}
          BENCHMARK_FIXTURES: ${{ inputs.fixtures }}
          BENCHMARK_ATTEMPTS: ${{ inputs.attempts }}
          BENCHMARK_RELEASE: ${{ inputs.release }}
          SHA: ${{ steps.skip.outputs.sha }}
        run: node "$GITHUB_WORKSPACE/.benchmark-harness/scripts/eval-benchmark/plan.mjs" "$RUNNER_TEMP/plan.json" "$SHA"

      - name: Upload plan
        if: steps.skip.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-plan
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          retention-days: 1

  # Live-model legs: fixture × model × attempt on the local world. Eval
  # failures are data, so neither the eval run nor the job fails the workflow.
  # e2e/benchmark.json `concurrency` caps legs (gateway load) and evals per
  # leg (runner contention, which skews latency).
  run-live:
    name: run-live (${{ matrix.fixture }}, ${{ matrix.model_id }}, ${{ matrix.attempt }})
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.live_matrix != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.live_matrix) }}
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      EVE_E2E_MODEL: ${{ matrix.model_id }}
      EVALS_PER_LEG: ${{ needs.plan.outputs.evals_per_leg }}
    steps:
      - name: Checkout code under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .benchmark-harness
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Resolve eve sandbox image
        # A backfilled release runs the sandbox image it shipped with: from
        # 0.49.1, eve's default is its own version's image (published for every
        # release since 0.49.0); older releases read no image tag. The release's
        # checkout also predates this action.
        if: inputs.release == ''
        uses: ./.github/actions/sandbox-image

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eve package
        run: pnpm --filter eve run build

      - name: Build extension fixtures
        # Mirrors e2e-local: extension fixtures ship no committed dist/.
        run: |
          pnpm --filter "./e2e/fixtures/*-extension" run --if-present build
          pnpm --filter dist-extensions update gizmo-extension gadget-extension

      - name: Run fixture evals
        working-directory: ${{ matrix.dir }}
        env:
          KEEP_STATE_FLAG: ${{ needs.plan.outputs.keep_state == 'true' && '--keep-state' || '' }}
        run: |
          pnpm run --if-present e2e:prepare
          pnpm exec eve eval --list --json > "$RUNNER_TEMP/expected.json"
          # --keep-state leaves the eval server's Workflow data for the world
          # probe; releases before eve 0.83.1 have no such flag.
          if ! pnpm exec eve eval --verbose $KEEP_STATE_FLAG --max-concurrency "$EVALS_PER_LEG"; then
            echo "::warning::Some evals failed; failures are recorded as benchmark data."
          fi

      - name: Export world probe
        if: needs.plan.outputs.keep_state == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          if ! node "$GITHUB_WORKSPACE/.benchmark-harness/scripts/eval-benchmark/export-world.mjs" . "$RUNNER_TEMP/world"; then
            echo "::warning::World probe export failed; durability metrics are recorded as unavailable."
            rm -rf "$RUNNER_TEMP/world"
          fi

      - name: Stage leg artifact
        if: always()
        env:
          LEG_ID: ${{ matrix.leg_id }}
          FIXTURE_DIR: ${{ matrix.dir }}
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
          MODEL_ID: ${{ matrix.model_id }}
          WORLD: ${{ matrix.world }}
          ATTEMPT: ${{ matrix.attempt }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: bash "$GITHUB_WORKSPACE/.benchmark-harness/.github/scripts/stage-benchmark-leg.sh"

      - name: Upload leg artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-leg-${{ matrix.leg_id }}
          path: ${{ runner.temp }}/leg
          if-no-files-found: error
          retention-days: 1

  # Mock-model legs: fixture × workflow world × e2e/benchmark.json
  # `mockAttempts`. With no model latency or cost, their timings are close to
  # pure eve overhead: the primary framework-overhead signal. Legs on a
  # production server also record build and start probes.
  run-mock:
    name: run-mock (${{ matrix.fixture }}, ${{ matrix.world }}, ${{ matrix.attempt }})
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.mock_matrix != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mock_matrix) }}
    # Unused by local-world legs; a service container cannot vary per leg.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: world
          POSTGRES_PASSWORD: world
          POSTGRES_USER: world
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=world --dbname=world"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Mock models never reach the gateway.
      AI_GATEWAY_API_KEY: invalid-e2e-world-suite-key
      EVE_E2E_MODEL: mock
      EVALS_PER_LEG: ${{ needs.plan.outputs.evals_per_leg }}
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: "52"
      WORKFLOW_POSTGRES_URL: postgres://world:world@127.0.0.1:5432/world
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: "50"
    steps:
      - name: Checkout code under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .benchmark-harness
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Resolve eve sandbox image
        # A backfilled release runs the sandbox image it shipped with: from
        # 0.49.1, eve's default is its own version's image (published for every
        # release since 0.49.0); older releases read no image tag. The release's
        # checkout also predates this action.
        if: inputs.release == ''
        uses: ./.github/actions/sandbox-image

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eve package
        run: pnpm --filter eve run build

      - name: Build extension fixtures
        run: |
          pnpm --filter "./e2e/fixtures/*-extension" run --if-present build
          pnpm --filter dist-extensions update gizmo-extension gadget-extension

      - name: Run fixture evals on the local world
        if: matrix.world == 'local'
        working-directory: ${{ matrix.dir }}
        env:
          KEEP_STATE_FLAG: ${{ needs.plan.outputs.keep_state == 'true' && '--keep-state' || '' }}
        run: |
          pnpm run --if-present e2e:prepare
          pnpm exec eve eval --list --json --exclude-tag real-model > "$RUNNER_TEMP/expected.json"
          if ! pnpm exec eve eval --verbose $KEEP_STATE_FLAG --exclude-tag real-model --max-concurrency "$EVALS_PER_LEG"; then
            echo "::warning::Some evals failed; failures are recorded as benchmark data."
          fi

      - name: Run fixture evals on a production server
        if: matrix.world != 'local'
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          pnpm run --if-present e2e:prepare
          pnpm exec eve eval --list --json --exclude-tag real-model > "$RUNNER_TEMP/expected.json"
          if [ "$WORLD" = "postgres" ]; then pnpm exec bootstrap; fi
          mkdir -p "$RUNNER_TEMP/probes"
          pnpm exec eve build --profile "$RUNNER_TEMP/probes/build-profile.json"
          server_log="$RUNNER_TEMP/server.log"
          # The start probe times eve itself, so it skips `pnpm exec`.
          start_ms="$(date +%s%3N)"
          EVE_DEV=1 ./node_modules/.bin/eve start --host 127.0.0.1 --port 3000 >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null; wait "$server_pid" 2>/dev/null || true' EXIT
          # Polls every 50 ms, so the probe resolves readiness to about that.
          ready=false
          for _ in {1..1200}; do
            if curl --fail --silent http://127.0.0.1:3000/eve/v1/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$server_log"; exit 1; fi
            sleep 0.05
          done
          if [ "$ready" != "true" ]; then
            cat "$server_log"
            echo "::error::Timed out waiting for the eve server."
            exit 1
          fi
          jq -n --argjson ready_ms "$(($(date +%s%3N) - start_ms))" '{readyMs: $ready_ms}' \
            >"$RUNNER_TEMP/probes/start.json"
          if ! pnpm exec eve eval --verbose --exclude-tag real-model --max-concurrency "$EVALS_PER_LEG" \
            --url http://127.0.0.1:3000; then
            echo "::warning::Some evals failed; failures are recorded as benchmark data."
          fi
        env:
          WORLD: ${{ matrix.world }}
          # Only non-local legs select a world; fixtures read an empty value
          # as a package name, so local legs must leave it unset.
          EVE_E2E_WORKFLOW_WORLD: ${{ matrix.world_package }}

      - name: Export world probe
        # A local world keeps its data only with --keep-state; others persist it.
        if: matrix.world != 'local' || needs.plan.outputs.keep_state == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          # Local legs read the kept eval server's data; others the leg's world.
          if [ -n "$WORLD_PACKAGE" ]; then export EVE_E2E_WORKFLOW_WORLD="$WORLD_PACKAGE"; fi
          if ! node "$GITHUB_WORKSPACE/.benchmark-harness/scripts/eval-benchmark/export-world.mjs" . "$RUNNER_TEMP/world"; then
            echo "::warning::World probe export failed; durability metrics are recorded as unavailable."
            rm -rf "$RUNNER_TEMP/world"
          fi
        env:
          WORLD_PACKAGE: ${{ matrix.world_package }}

      - name: Stage leg artifact
        if: always()
        env:
          LEG_ID: ${{ matrix.leg_id }}
          FIXTURE_DIR: ${{ matrix.dir }}
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
          MODEL_ID: ${{ matrix.model_id }}
          WORLD: ${{ matrix.world }}
          ATTEMPT: ${{ matrix.attempt }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: bash "$GITHUB_WORKSPACE/.benchmark-harness/.github/scripts/stage-benchmark-leg.sh"

      - name: Upload leg artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-leg-${{ matrix.leg_id }}
          path: ${{ runner.temp }}/leg
          if-no-files-found: error
          retention-days: 1

  # Mock-model legs on a hosted world: each deploys its fixture to a Vercel
  # preview and runs the evals against it, so the timings include hosted
  # Workflow queueing and invocation round trips that local servers never pay.
  # One leg at a time, so concurrent legs don't contend for the same project.
  # No world probe (the World's event log isn't local) and no build or start
  # probes (they would measure Vercel's build and deploy, not eve).
  # Release backfills plan none: the hosted platform is today's, not the release's.
  run-hosted:
    name: run-hosted (${{ matrix.fixture }}, ${{ matrix.world }}, ${{ matrix.attempt }})
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.hosted_matrix != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.hosted_matrix) }}
    env:
      EVE_E2E_MODEL: mock
      EVALS_PER_LEG: ${{ needs.plan.outputs.evals_per_leg }}
    steps:
      - name: Checkout planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest && vercel --version

      - name: Resolve eve sandbox image
        uses: ./.github/actions/sandbox-image

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eve package
        # Full build, not build:js: deployed bundles carry the stamped version.
        run: pnpm --filter eve run build

      - name: Deploy fixture and run evals
        working-directory: ${{ matrix.dir }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_USE_EXPERIMENTAL_FRAMEWORKS: "1"
        # Mirrors e2e-vercel.yml's deploy and readiness wait.
        run: |
          set -euo pipefail
          pnpm run --if-present e2e:prepare
          pnpm exec eve eval --list --json --exclude-tag real-model > "$RUNNER_TEMP/expected.json"

          token_args=(--token "$VERCEL_TOKEN")
          # Set only when the pinned image is unpublished; see .github/actions/sandbox-image.
          image_env_args=()
          if [ -n "${EVE_SANDBOX_IMAGE_TAG:-}" ]; then
            image_env_args=(--env "EVE_SANDBOX_IMAGE_TAG=$EVE_SANDBOX_IMAGE_TAG")
          fi
          vercel link --yes --project "$VERCEL_PROJECT_ID" --team "$VERCEL_ORG_ID" "${token_args[@]}"
          vercel env pull --yes --environment=preview "${token_args[@]}"
          VERCEL_OIDC_TOKEN="$(node --env-file=.env.local -p 'process.env.VERCEL_OIDC_TOKEN ?? ""')"
          # Do not add VERCEL_TEAM_ID: sandbox templates must key identically
          # at build and runtime, and runtime has no team variable.
          VERCEL=1 VERCEL_ENV=preview VERCEL_TARGET_ENV=preview VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" \
            pnpm exec eve build
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --yes --target=preview \
            --env "EVE_E2E_MODEL=$EVE_E2E_MODEL" \
            "${image_env_args[@]}" \
            "${token_args[@]}" | tail -n 1)"
          echo "Deployed $DEPLOYMENT_URL"

          ready=false
          for attempt in $(seq 1 15); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_OIDC_TOKEN" \
              --header "x-vercel-trusted-oidc-idp-token: $VERCEL_OIDC_TOKEN" \
              --max-time 3 "$DEPLOYMENT_URL/eve/v1/health" || true)"
            if [ "$status" = "200" ]; then ready=true; break; fi
            echo "Deployment not ready (attempt $attempt/15, health status ${status:-transport-error})"
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Timed out waiting for $DEPLOYMENT_URL."
            exit 1
          fi
          if ! pnpm exec eve eval --verbose --exclude-tag real-model --max-concurrency "$EVALS_PER_LEG" \
            --url "$DEPLOYMENT_URL"; then
            echo "::warning::Some evals failed; failures are recorded as benchmark data."
          fi

      - name: Stage leg artifact
        if: always()
        env:
          LEG_ID: ${{ matrix.leg_id }}
          FIXTURE_DIR: ${{ matrix.dir }}
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
          MODEL_ID: ${{ matrix.model_id }}
          WORLD: ${{ matrix.world }}
          ATTEMPT: ${{ matrix.attempt }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: bash .github/scripts/stage-benchmark-leg.sh

      - name: Upload leg artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-leg-${{ matrix.leg_id }}
          path: ${{ runner.temp }}/leg
          if-no-files-found: error
          retention-days: 1

  # `eve dev` startup for the benchmark agents in e2e/benchmark.json
  # `devStartup`, recorded as run-level framework records.
  dev-startup:
    name: dev-startup
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.dev_startup != 'null'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Checkout code under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .benchmark-harness
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eve package
        run: pnpm --filter eve run build

      - name: Run startup benchmark
        env:
          DEV_STARTUP: ${{ needs.plan.outputs.dev_startup }}
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          out="$RUNNER_TEMP/dev-startup"
          mkdir -p "$out"
          jq -n --arg sha "$PLANNED_SHA" --arg runner_os "$RUNNER_OS_NAME" \
            '{sha: $sha, runner_os: $runner_os}' >"$out/meta.json"
          runs="$(jq -r '.runs' <<<"$DEV_STARTUP")"
          while read -r name tools; do
            if ! node "$GITHUB_WORKSPACE/.benchmark-harness/packages/eve/scripts/benchmark-startup.mjs" packages/eve "$runs" "$tools" >"$out/$name.jsonl"; then
              echo "::warning::Startup benchmark for $name failed; its runs are recorded as missing."
            fi
          done < <(jq -r '.subjects[] | "\(.name) \(.tools)"' <<<"$DEV_STARTUP")

      - name: Upload startup results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-dev-startup
          path: ${{ runner.temp }}/dev-startup
          if-no-files-found: error
          retention-days: 1

  # Runs main's code, never code a leg uploaded or the release a backfill planned.
  # Planned legs without an artifact become `missing` records.
  publish:
    name: publish
    needs: [plan, run-live, run-mock, run-hosted, dev-startup]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's code, never the planned commit: a backfill plans a release.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-plan
          path: ${{ runner.temp }}/plan

      - name: Prepare leg directory
        run: mkdir -p "$RUNNER_TEMP/legs"

      - name: Download leg artifacts
        # No match is valid (every leg failed to upload); records mark those legs missing.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-leg-*
          path: ${{ runner.temp }}/legs

      - name: Download startup results
        # Absent when the dev-startup job did not upload; its records are marked missing.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-dev-startup
          path: ${{ runner.temp }}/dev-startup

      - name: Derive records
        run: |
          node scripts/eval-benchmark/records.mjs "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/legs" "$RUNNER_TEMP/records.jsonl"
          node scripts/eval-benchmark/framework-records.mjs "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/legs" \
            "$RUNNER_TEMP/dev-startup" "$RUNNER_TEMP/framework-records.jsonl"

      - name: Publish to Blob
        env:
          EVE_BENCHMARK_BLOB_READ_WRITE_TOKEN: ${{ secrets.EVE_BENCHMARK_BLOB_READ_WRITE_TOKEN }}
        run: |
          node scripts/eval-benchmark/publish.mjs "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/legs" \
            "$RUNNER_TEMP/records.jsonl" "$RUNNER_TEMP/dev-startup" "$RUNNER_TEMP/framework-records.jsonl"
