name: E2E Tests (Local)

on:
  workflow_dispatch:
    inputs:
      cache_compare_ref:
        description: "Compare prompt-cache requests against this base commit (empty runs the normal suite)"
        type: string
        default: ""
  pull_request:

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The e2e matrix jobs are required status checks, so they must report on
  # every PR. An `on.pull_request.paths` filter would leave them permanently
  # "expected" on PRs that don't touch e2e-relevant paths, blocking merge.
  # Instead the workflow always triggers, this job decides relevance, and the
  # matrix jobs skip when nothing relevant changed — skipped required checks
  # count as satisfied.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check changed paths
        id: filter
        env:
          CACHE_COMPARE_REF: ${{ inputs.cache_compare_ref }}
        run: |
          if [ -n "$CACHE_COMPARE_REF" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit; HEAD^1 is the base branch tip, so
          # this diff is exactly the PR's changed files.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(packages/eve/|apps/fixtures/|e2e/|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.github/workflows/e2e-local\.yml$|\.github/scripts/discover-e2e-fixtures\.mjs$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  discover-fixtures:
    name: discover-fixtures
    runs-on: ubuntu-latest
    outputs:
      model_matrix: ${{ steps.discover.outputs.model_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover eval fixtures
        id: discover
        run: node .github/scripts/discover-e2e-fixtures.mjs

  # The model suite: every fixture runs here against the local world with
  # real matrix models. Model-sensitive fixtures (`"e2e": { "modelMatrix":
  # "full" }` in package.json) run on every matrix model; the rest run once
  # on the default model. The world suites (e2e-vercel, e2e-postgres) cover
  # the other workflow worlds with deterministic mock models.
  e2e:
    name: e2e-local (${{ matrix.name }}, ${{ matrix.model_name }})
    runs-on: ubuntu-latest
    needs: [changes, discover-fixtures]
    # No job-level `if`: the stable aggregate check below requires a successful
    # matrix result. Guarding each step lets an irrelevant diff satisfy it in
    # seconds without running setup or evals.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-fixtures.outputs.model_matrix) }}

    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      EVE_E2E_MODEL: ${{ matrix.model_id }}
      EVE_EVAL_JUNIT_DIR: ${{ github.workspace }}/.junit
      EVE_SANDBOX_IMAGE_TAG: latest

    steps:
      - name: Checkout code
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: needs.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build eve package
        if: needs.changes.outputs.relevant == 'true'
        # Full build, not build:js: the deployed/runtime bundles must carry the
        # stamped package version (scripts/stamp-version-tokens.mjs) and docs.
        run: pnpm --filter eve run build

      - name: Build extension fixtures
        if: needs.changes.outputs.relevant == 'true'
        # Extension fixtures ship no committed `dist/`; produce it here so
        # consuming fixtures resolve the built artifacts. `--if-present` skips
        # extension fixtures without a build script. The update re-packs the
        # `file:`-protocol store copies so they pick up the fresh dist —
        # a plain reinstall short-circuits and leaves them stale.
        run: |
          pnpm --filter "./e2e/fixtures/*-extension" run --if-present build
          pnpm --filter dist-extensions update gizmo-extension gadget-extension

      - name: Stage workspace extension fixtures as dist-only
        if: needs.changes.outputs.relevant == 'true'
        # Removing author source proves the workspace consumer discovers and
        # compiles the same agent-shaped dist trees we publish. Toolkit covers
        # the rich TypeScript surface; js-only covers pure JavaScript authoring.
        run: |
          mv e2e/fixtures/toolkit-extension/extension "$RUNNER_TEMP/toolkit-extension-source"
          mv e2e/fixtures/js-only-extension/extension "$RUNNER_TEMP/js-only-extension-source"

      - name: Run fixture evals
        if: needs.changes.outputs.relevant == 'true'
        run: |
          mkdir -p "$EVE_EVAL_JUNIT_DIR"
          cd "${{ matrix.dir }}"
          pnpm exec eve eval --strict --verbose \
            --junit "$EVE_EVAL_JUNIT_DIR/${{ matrix.name }}-${{ matrix.model_name }}.xml"

      - name: Upload eval artifacts
        if: (failure()) && needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-artifacts-${{ matrix.name }}-${{ matrix.model_name }}
          path: |
            .junit
            e2e/fixtures/*/.eve/evals
            apps/fixtures/*/.eve/evals
            ${{ matrix.dir }}/.eve/traces
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  cache-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.cache_compare_ref != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        revision: [base, head]
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      EVE_E2E_MODEL: anthropic/claude-opus-5
    steps:
      - name: Checkout capture tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve identical capture code for both revisions
        run: cp .github/scripts/prompt-cache-capture.mjs "$RUNNER_TEMP/prompt-cache-capture.mjs"
      - name: Checkout compared revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision == 'base' && inputs.cache_compare_ref || github.sha }}
          persist-credentials: false
      - name: Record compared commit
        run: git rev-parse HEAD
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build eve
        run: pnpm --filter eve run build
      - name: Run unchanged cache gates with transport capture
        working-directory: e2e/fixtures/agent-prompt-cache
        run: |
          export NODE_OPTIONS="--import=$RUNNER_TEMP/prompt-cache-capture.mjs"
          export EVE_CACHE_CAPTURE_FILE="$RUNNER_TEMP/cache-wire.ndjson"
          pnpm exec eve eval --strict --verbose
      - name: Require transport evidence
        if: always()
        run: test -s "$RUNNER_TEMP/cache-wire.ndjson"
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-comparison-${{ matrix.revision }}
          path: |
            ${{ runner.temp }}/cache-wire.ndjson
            e2e/fixtures/agent-prompt-cache/.eve/evals
            e2e/fixtures/agent-prompt-cache/.eve/traces
          include-hidden-files: true
          retention-days: 7

  e2e-required:
    name: e2e-local
    runs-on: ubuntu-latest
    needs: [e2e, cache-comparison]
    if: always()
    steps:
      - name: Require successful e2e matrix
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          CACHE_COMPARE_REF: ${{ inputs.cache_compare_ref }}
          CACHE_RESULT: ${{ needs.cache-comparison.result }}
        run: |
          if [ -n "$CACHE_COMPARE_REF" ] && [ "$CACHE_RESULT" != "success" ]; then
            echo "Cache comparison result: $CACHE_RESULT"
            exit 1
          fi
          if [ "$E2E_RESULT" != "success" ]; then
            echo "E2E matrix result: $E2E_RESULT"
            exit 1
          fi
