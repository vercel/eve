name: Deprecate Buzz adapter on npm

on:
  push:
    branches: [deprecate-buzz-adapter-on-npm]

permissions:
  contents: read

jobs:
  deprecate:
    if: github.event.created == true && github.ref == 'refs/heads/deprecate-buzz-adapter-on-npm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Deprecate all published versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_BOT }}
        run: npm deprecate '@eve/buzz-acp-adapter@*' 'The eve Buzz adapter is discontinued and no longer supported.'
