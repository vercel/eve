packages:
  - apps/*
  - apps/*/*
  - e2e/fixtures/*
  - packages/*

allowBuilds:
  # Registry templates import types only; this optional build is not needed.
  "@google/genai": false
  braintrust: false
  "@mongodb-js/zstd": true
  "@nestjs/core": true
  "@parcel/watcher": false
  bufferutil: false
  cbor-extract: true
  esbuild: true
  node-liblzma: false
  phase: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: false
  webgpu: true

catalog:
  "@ai-sdk/anthropic": "^4.0.36"
  "@ai-sdk/google": "^4.0.39"
  "@ai-sdk/mcp": "^2.0.29"
  "@ai-sdk/openai": "^4.0.36"
  "@ai-sdk/otel": "^1.0.58"
  "@ai-sdk/provider": "^4.0.7"
  "@ai-sdk/provider-utils": "^5.0.25"
  "@opentelemetry/context-async-hooks": "2.6.1"
  "@opentelemetry/core": "2.6.1"
  "@opentelemetry/sdk-trace-base": "2.6.1"
  "@types/node": "25.9.1"
  "@types/react": "19.2.15"
  "@types/react-dom": "19.2.3"
  "@vercel/connect": "0.4.3"
  "@vercel/otel": "2.1.3"
  "@vercel/sandbox": "2.8.0"
  "@workflow/world-postgres": "5.0.0-beta.33"
  ai: "^7.0.58"
  better-auth: "1.6.26"
  marked: "17.0.6"
  next: "16.3.0-preview.6"
  phase: "0.0.1"
  picocolors: "1.1.1"
  react: "19.2.6"
  react-dom: "19.2.6"
  streamdown: "2.5.0"
  typescript: "7.0.2"
  vitest: "4.1.10"
  zod: "4.4.3"

minimumReleaseAge: 2880 # 2 days

minimumReleaseAgeExclude:
  - "@vercel/*"
  - "@workflow/*"
  - nitro
  - workflow
