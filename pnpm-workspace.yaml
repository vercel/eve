packages:
  - apps/*
  - apps/*/*
  - e2e/fixtures/*
  - packages/*

allowBuilds:
  # Registry templates import types only; this optional build is not needed.
  "@google/genai": false
  braintrust: false
  "@mongodb-js/zstd": true
  "@nestjs/core": true
  "@parcel/watcher": false
  bufferutil: false
  cbor-extract: true
  esbuild: true
  node-liblzma: false
  phase: false
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: false
  webgpu: true

catalog:
  "@ai-sdk/anthropic": "^4.0.18"
  "@ai-sdk/google": "^4.0.21"
  "@ai-sdk/mcp": "^2.0.16"
  "@ai-sdk/openai": "^4.0.17"
  "@ai-sdk/otel": "^1.0.34"
  "@ai-sdk/provider": "^4.0.3"
  "@ai-sdk/provider-utils": "^5.0.12"
  "@opentelemetry/core": "2.6.1"
  "@opentelemetry/sdk-trace-base": "2.6.1"
  "@types/node": "25.9.1"
  "@types/react": "19.2.15"
  "@types/react-dom": "19.2.3"
  "@vercel/connect": "0.4.2"
  "@vercel/otel": "2.1.3"
  "@vercel/sandbox": "2.8.0"
  ai: "^7.0.38"
  marked: "17.0.6"
  next: "16.3.0-preview.6"
  phase: "0.0.1"
  picocolors: "1.1.1"
  react: "19.2.6"
  react-dom: "19.2.6"
  streamdown: "2.5.0"
  typescript: "7.0.2"
  vitest: "4.1.10"
  zod: "4.4.3"

minimumReleaseAge: 2880 # 2 days

minimumReleaseAgeExclude:
  # Registry packages are explicitly reviewed before they are added to the eve registry.
  - "@agent-browser/eve"
  - "@agent-browser/sandbox"
  - "@agentphone/chat-sdk-adapter"
  - "@beeper/chat-adapter-matrix"
  - "@browserbasehq/eve"
  - "@chat-adapter/*"
  - "@getdial/chat-sdk-adapter"
  - "@github-tools/eve-extension"
  - "@github-tools/sdk"
  - "@kapso/chat-adapter"
  - "@larksuite/vercel-chat-adapter"
  - "@linqapp/chat-sdk-adapter"
  - "@liveblocks/chat-sdk-adapter"
  - "@novu/chat-sdk-adapter"
  - "@photon-ai/chat-adapter-imessage"
  - "@resend/chat-sdk-adapter"
  - "@upstash/agentkit-eve-extension"
  - "@veltdev/chat-sdk-adapter"
  - "@zernio/chat-sdk-adapter"
  - chat
  - chat-adapter-sendblue
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@typescript/typescript-*"
  - "@turbo/*"
  - "@workflow/*"
  - "@vercel/*"
  - "@vgpu/*"
  - ai
  - crossws
  - experimental-ai-sdk-code-mode
  - eve
  - nf3
  - nitro
  - rolldown
  # This release contains the reviewed package-config registry APIs used by the eve CLI.
  - shadcn@4.16.0
  - turbo
  - typescript
  - vercel
  - workflow
  - phase@0.0.1
