autoDedupe: true
enableGlobalVirtualStore: false

lockfile:
  includeResolutionSettings: true

packages:
  - apps/*
  - apps/docs/registry
  - apps/fixtures/*
  - apps/frameworks/*
  - e2e/fixtures/*
  - examples/*
  - packages/*

allowBuilds:
  "@google/genai": false # No-op preinstall.
  braintrust: false # Installs an optional CLI binary; the SDK does not need it.
  bufferutil: false # The package already includes the supported prebuilt bindings.
  core-js-pure: false # Not needed at runtime; avoids unapproved lifecycle scripts.
  cpu-features: false # Optional ssh2 acceleration; JavaScript fallback is sufficient.
  esbuild: true # Verifies the installed platform binary.
  phase: false # Would install its own Git hooks.
  protobufjs: false # Only checks the package version.
  sharp: false # Prebuilt platform packages need no install script.
  ssh2: false # Optional native acceleration; JavaScript fallback is sufficient.
  unrs-resolver: false # Prebuilt platform packages need no repair script.
  "@vgpu/adapter-node": false # Best-effort Dawn download; the adapter fetches it at runtime when needed.
  webgpu: true # Clears macOS quarantine from its packaged native binding.

ignoredOptionalDependencies:
  - "@braintrust/bt-*"
  - "@mongodb-js/zstd"
  - cbor-extract
  - node-liblzma

catalog:
  "@ai-sdk/anthropic": "^4.0.104"
  "@ai-sdk/google": "^4.0.120"
  "@ai-sdk/mcp": "^2.0.99"
  "@ai-sdk/openai": "^4.0.117"
  "@ai-sdk/otel": "^1.0.172"
  "@ai-sdk/provider": "^4.0.38"
  "@ai-sdk/provider-utils": "^5.0.81"
  "@opentelemetry/context-async-hooks": "2.12.1"
  "@opentelemetry/core": "2.12.1"
  "@opentelemetry/sdk-trace-base": "2.12.1"
  "@types/node": "26.6.6"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@vercel/connect": "2.9.2"
  "@vercel/otel": "2.3.0"
  "@vercel/sandbox": "4.0.0"
  "@workflow/world-postgres": "5.2.0"
  ai: "^7.0.172"
  better-auth: "1.7.21"
  marked: "18.2.0"
  next: "16.4.6"
  phase: "0.7.6"
  picocolors: "1.1.1"
  react: "19.3.1"
  react-dom: "19.3.1"
  streamdown: "2.7.1"
  typescript: "7.0.2"
  vitest: "5.1.0"
  zod: "4.6.7"

overrides:
  # Security fixes for transitive dependencies.
  "simple-git@<4.0.2": "4.0.2"
  "shell-quote@<1.11.0": "1.11.0"
  "dompurify@<3.4.17": "3.4.17"
  "turndown@<7.2.5": "7.2.5"
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  # eve ships one vendored Zod (packages/eve/scripts/vendor-compiled/zod.mjs).
  # @vercel/cli-config, which @vercel/oidc uses, pins its own Zod 4 release,
  # and the vendor build fails on a second copy.
  "@vercel/cli-config>zod": "catalog:"
  # @vercel/connect peers on eve. Inside packages/eve that peer cannot resolve
  # to the workspace package, so pnpm pulls a published eve from npm instead.
  # Since pnpm 12.9, `pnpm update` re-resolves that peer to the workspace
  # version, which is unpublished on release PRs and fails the install.
  "@vercel/connect>eve": "workspace:*"

minimumReleaseAge: 2880 # 2 days

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - ai
  - eve
  - "@vercel/*"
  - "@workflow/*"
  - workflow
  - nitro
  - "@memco/eve@0.2.0"
  - "@memco/memcoai@0.4.0"
  - "@stripe/link-integrations-eve@0.5.0"
  - "@stripe/link-sdk@3.1.0"
  - "claude-mem@15.18.1"
patchedDependencies:
  "@vercel/geistdocs@2.14.2": patches/@vercel__geistdocs@2.14.2.patch
